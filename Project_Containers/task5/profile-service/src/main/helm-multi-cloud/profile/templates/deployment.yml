apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-profile-deployment
spec:
  selector:
    matchLabels:
      app: profile-deployment
  replicas: 3
  template:
    metadata:
      labels:
        app: profile-deployment
    spec:
      containers:
        - name: profile-deployment
          image: wechatcontainerregistry.azurecr.io/profile-image:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: spring-profile-config
          resources:
            requests:
              cpu: 200m

---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: spring-profile-autoscaling
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spring-profile-deployment
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
