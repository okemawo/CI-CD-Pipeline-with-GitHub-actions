apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-login-deployment
spec:
  selector:
    matchLabels:
      app: login-deployment 
  replicas: 3
  template:
    metadata:
      labels:
        app: login-deployment 
    spec:
      containers:
      - name: login-deployment
        image: gcr.io/gcp-docker-kubernetes-413600/login-service:1.0
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: spring-login-config