apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-profile-deployment
spec:
  selector:
    matchLabels:
      app: profile-deployment 
  replicas: 3
  template:
    metadata:
      labels:
        app: profile-deployment 
    spec:
      containers:
      - name: profile-deployment
        image: gcr.io/gcp-docker-kubernetes-413600/profile-service/container:1.0
        ports:
        - containerPort: 8080